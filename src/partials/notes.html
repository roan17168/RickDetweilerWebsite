<dialog class="notes-panel" id="notes-panel" aria-labelledby="notes-title">
  <div class="notes-header">
    <div>
      <span class="section-label">Sources</span>
      <h2 id="notes-title">Sources for this page</h2>
    </div>
    <button class="notes-close" type="button" data-notes-close aria-label="Close sources">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <ol class="notes-list">
    {{NOTES_LIST}}
  </ol>
</dialog>
